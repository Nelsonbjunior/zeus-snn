<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeus - xadrez</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--borda:#262a31;--txt:#e9ebee;--dim:#8b929c;--azul:#5aa9ff;
  --verde:#22c55e;--verm:#ef4444;--amar:#facc15;--claro:#e8d7b5;--escuro:#a57a52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1500px;margin:0 auto;padding:22px 20px 40px}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:3px}
.sub{color:var(--dim);font-size:14px}
.placar{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--borda);
  border-radius:16px;padding:12px 22px}
.lado{text-align:center;min-width:110px}
.lado b{display:block;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.lado span{color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.lado.zeus b{color:var(--azul)}.lado.ap b{color:var(--verde)}
.x{font-size:26px;color:var(--dim)}
.emp{color:var(--dim);font-size:13px;text-align:center;margin-top:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px;display:flex;
  flex-direction:column;gap:10px;transition:border-color .3s}
.card.foco{border-color:var(--azul);box-shadow:0 0 0 2px #5aa9ff44}
.card.desligado{opacity:.55}
.topo{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.on{background:var(--verde);box-shadow:0 0 8px var(--verde)}
.nome{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini b{color:var(--txt)}
.tab{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;
  border-radius:8px;overflow:hidden;container-type:inline-size}
.tab div{min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font:11cqw/1 "Segoe UI Symbol",serif;color:#000}
.tab .l{background:var(--claro)}.tab .e{background:var(--escuro)}.tab .u{box-shadow:inset 0 0 0 3px var(--amar)}
.vazio{aspect-ratio:1;border-radius:8px;border:1px dashed var(--borda);display:flex;align-items:center;
  justify-content:center;color:var(--dim);text-align:center;padding:20px}
.info{font-size:13px;color:var(--dim);min-height:20px}
.estado{font-weight:600;min-height:22px}
.estado.pensa{color:var(--azul)}.estado.vez{color:var(--verde)}.estado.fim{color:var(--amar)}
.pensa::after{content:"";animation:pontos 1.2s steps(4) infinite}
@keyframes pontos{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.nada{color:var(--dim);margin-top:40px;text-align:center}
</style>
</head>
<body>
<main>
<header>
  <div><h1>ZEUS · XADREZ</h1><div class="sub" id="resumo">carregando...</div></div>
  <div>
    <div class="placar">
      <div class="lado zeus"><b id="pz">0</b><span>Zeus</span></div>
      <div class="x">×</div>
      <div class="lado ap"><b id="pa">0</b><span>Aparelhos</span></div>
    </div>
    <div class="emp" id="pe"></div>
  </div>
</header>
<div class="grade" id="grade"></div>
<div class="nada" id="nada" hidden>Nenhum aparelho jogando agora. Peça no app: “Zeus, vamos jogar xadrez”.</div>
</main>
<script>
const U={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let foco=new URLSearchParams(location.search).get('d')||'',focoSeq=-1,rolar=!!foco;
let ultimo='';
function casa(i){return 'abcdefgh'[i%8]+(8-Math.floor(i/8))}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function plural(n,s,p){return n+' '+(n===1?s:p)}
function tabuleiro(p){
  const f=p.visto_pelas_pretas,u=p.ultimo_lance_uci||'';let h='';
  for(let k=0;k<64;k++){const i=f?63-k:k;
    h+='<div class="'+((Math.floor(k/8)+k%8)%2?'e':'l')+(u&&u.includes(casa(i))?' u':'')+'">'+(U[p.casas[i]]||'')+'</div>'}
  return '<div class="tab">'+h+'</div>';
}
function cartao(a){
  const p=a.partida,pl=a.placar,n=esc(a.nome);
  let estado='',cls='',info='';
  if(!p){estado='sem partida agora';}
  else if(p.fim){                                    // "você venceu" visto do notebook: o nome do aparelho
    estado=/^você/i.test(p.resultado)?n+p.resultado.slice(4):p.resultado.charAt(0).toUpperCase()+p.resultado.slice(1);
    cls='fim'}
  else if(a.pensando){estado='Zeus calculando';cls='pensa'}
  else if(p.vez==='voce'){estado='vez de '+n;cls='vez'}
  else{estado='vez do Zeus'}
  if(p){
    info=n+' joga de '+p.voce_joga+' · nível '+p.nivel+' · lance '+p.lance_numero;
    const l=[];if(p.voce)l.push(n+': '+esc(p.voce.san_pt));if(p.zeus)l.push('Zeus: '+esc(p.zeus.san_pt));
    if(l.length)info+='<br>'+l.join(' · ');
  }
  const emp=pl.empates?' · '+plural(pl.empates,'empate','empates'):'';
  return '<div class="card'+(a.ligado?'':' desligado')+(foco&&foco.slice(0,a.id.length)===a.id?' foco':'')+'">'+
    '<div class="topo"><span class="dot'+(a.ligado?' on':'')+'" title="'+(a.ligado?'ligado':'desligado')+'"></span>'+
    '<span class="nome" title="'+n+'">'+n+'</span>'+
    '<span class="mini">Zeus <b>'+pl.zeus+'</b> × <b>'+pl.aparelho+'</b>'+emp+'</span></div>'+
    (p?tabuleiro(p):'<div class="vazio">'+(a.ligado?'ligado, sem partida':'desligado')+'</div>')+
    '<div class="estado '+cls+'">'+estado+'</div><div class="info">'+info+'</div></div>';
}
async function tick(){
  try{
    const r=await fetch('/xadrez/todas',{cache:'no-store'});
    const d=await r.json(),txt=JSON.stringify(d);
    if(txt===ultimo)return;ultimo=txt;
    // "ver no notebook" de um celular com o painel ja aberto: destaca e rola ate a partida dele
    if(d.foco&&d.foco.seq!==focoSeq){if(focoSeq>=0&&d.foco.id){foco=d.foco.id;rolar=true}focoSeq=d.foco.seq}
    document.getElementById('pz').textContent=d.placar.zeus;
    document.getElementById('pa').textContent=d.placar.aparelho;
    document.getElementById('pe').textContent=d.placar.empates?plural(d.placar.empates,'empate','empates'):'';
    document.getElementById('resumo').textContent=plural(d.ligados,'aparelho ligado','aparelhos ligados')+
      ' · '+plural(d.jogando,'partida em andamento','partidas em andamento');
    document.getElementById('grade').innerHTML=d.aparelhos.map(cartao).join('');
    document.getElementById('nada').hidden=d.aparelhos.length>0;
    if(rolar){const c=document.querySelector('.card.foco');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});rolar=false}}
  }catch(e){document.getElementById('resumo').textContent='sem contato com a ponte do Zeus'}
}
setInterval(tick,800);tick();
</script>
</body>
</html>
